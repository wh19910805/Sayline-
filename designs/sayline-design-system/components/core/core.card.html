<!-- @dsCard group="Components" viewport="760x1040" name="Core controls" subtitle="Actions, fields, selection, and metadata" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-ui); }
    .card-page { padding: 28px; display: grid; gap: 24px; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .group { display: grid; gap: 11px; }
    .label { color: var(--color-text-tertiary); font-size: var(--text-caption); letter-spacing: var(--tracking-label); text-transform: uppercase; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    h3 { margin: 0; font-family: var(--font-display); font-size: 24px; font-weight: 400; }
  </style>
</head>
<body>
  <main class="card-page">
    <section class="group">
      <h3>Actions that know when to lead.</h3>
      <div class="row">
        <button class="sl-button">继续学习</button>
        <button class="sl-button sl-button--accent">完成本环节</button>
        <button class="sl-button sl-button--secondary">稍后继续</button>
        <button class="sl-button sl-button--ghost">取消</button>
        <button class="sl-button" disabled>不可用</button>
      </div>
    </section>
    <div id="icons"></div>
    <div class="split">
      <div class="group"><div class="label">Field</div><div id="field"></div></div>
      <div class="group"><div class="label">Selection</div><div id="checks"></div></div>
    </div>
    <div class="group">
      <div class="label">Metadata</div>
      <div class="row">
        <span class="sl-badge">4 分 28 秒</span>
        <span class="sl-badge sl-badge--action">职场英语</span>
        <span class="sl-badge sl-badge--success">已收藏</span>
        <span class="sl-badge sl-badge--warning">字幕校验中</span>
      </div>
    </div>
  </main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const {
      Icon,
      IconButton,
      Input,
      Textarea,
      Checkbox,
      Switch,
    } = window.SaylineDesignSystem_1a4fd3;

    function Icons() {
      return (
        <div className="group">
          <div className="label">Functional line icons · 20 / 24</div>
          <div className="row">
            {["heart", "headphones", "book-open", "pen-line", "mic", "play", "pause"].map((name) => (
              <span key={name} style={{ width: 44, height: 44, display: "grid", placeItems: "center", border: "1px solid var(--color-border)", borderRadius: 10 }}>
                <Icon name={name} />
              </span>
            ))}
            <IconButton label="更多操作" variant="outline"><Icon name="ellipsis" /></IconButton>
            <IconButton label="收藏课程" active><Icon name="heart" /></IconButton>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("icons")).render(<Icons />);
    ReactDOM.createRoot(document.getElementById("field")).render(
      <div style={{ display: "grid", gap: 16 }}>
        <Input id="phone-demo" label="手机号" placeholder="请输入手机号" hint="用于登录和学习记录同步" />
        <Input id="phone-error-demo" label="手机号" value="138" error="请输入 11 位手机号" onChange={() => {}} />
      </div>,
    );
    ReactDOM.createRoot(document.getElementById("checks")).render(
      <div>
        <Checkbox id="terms-demo" defaultChecked>我已阅读并同意用户协议</Checkbox>
        <Textarea id="dictation-demo" label="写下你听到的句子" placeholder="Type what you hear…" hint="忽略大小写与标点" />
        <Switch id="translation-demo" checked>听写时显示中文翻译</Switch>
      </div>,
    );
  </script>
</body>
</html>
