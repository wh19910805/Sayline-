<!-- @dsCard group="Components" viewport="760x760" name="Learning controls" subtitle="Courses, progress, modes, and learning metrics" -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../styles.css">
  <style>
    body { margin: 0; background: var(--color-bg); font-family: var(--font-ui); }
    .card-page { padding: 28px; display: grid; gap: 24px; }
    .label { color: var(--color-text-tertiary); font-size: var(--text-caption); letter-spacing: var(--tracking-label); text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .mode-frame { width: 390px; padding: 12px; border-radius: 20px; background: linear-gradient(135deg,#596247,#2a3025); }
    h3 { margin: 0; font-family: var(--font-display); font-size: 25px; font-weight: 400; }
  </style>
</head>
<body>
  <main class="card-page">
    <section><h3>Practice stays visible.</h3><div id="cards"></div></section>
    <section><div class="label">Mode dock on cover-tinted surface</div><div class="mode-frame"><div id="modes"></div></div></section>
    <section><div class="label">Report metrics</div><div class="grid" id="stats"></div></section>
  </main>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { CategoryCard, CourseCard, ProgressBar, ModeSwitcher, StatTile, WordInput } = window.SaylineDesignSystem_1a4fd3;

    ReactDOM.createRoot(document.getElementById("cards")).render(
      <div style={{ display: "grid", gap: 10 }}>
        <div style={{ width: 220 }}>
          <CategoryCard
            title="职场英语"
            description="会议、协作与职场表达"
            courseCount={3}
            coverUrl="../../assets/covers/work.jpg"
          />
        </div>
        <CourseCard title="Meeting a New Colleague" meta="职场英语 · 4 分 28 秒" favorite />
        <CourseCard title="Coffee Chat Basics" meta="日常口语 · 3 分 12 秒" colorA="#3a6485" colorB="#1b3346" progress={46} />
        <div style={{ padding: "16px", borderRadius: 14, background: "#22281f", color: "#f4f0e8" }}>
          <WordInput words={["Could", "we", "move", "the", "meeting", "to", "Friday?"]} />
        </div>
      </div>,
    );
    ReactDOM.createRoot(document.getElementById("modes")).render(
      <ModeSwitcher value="listen" />,
    );
    ReactDOM.createRoot(document.getElementById("stats")).render(
      <>
        <StatTile value="4" label="学习天数" />
        <StatTile value="6" label="学习次数" />
        <StatTile value="3h20m" label="学习时长" />
      </>,
    );
  </script>
</body>
</html>
