<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayline Learner Screens</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 44px 64px;
      color: var(--color-text);
      background:
        radial-gradient(circle at 8% 0%, rgba(255,255,255,.8), transparent 26%),
        #dedbd4;
      font-family: var(--font-ui);
    }
    header { max-width: 1280px; margin: 0 auto 34px; display: flex; justify-content: space-between; align-items: flex-end; gap: 30px; }
    .eyebrow { margin: 0 0 8px; color: var(--color-text-tertiary); font-size: 9px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-family: var(--font-display); font-size: 58px; font-weight: 400; line-height: .96; letter-spacing: -.03em; }
    header p { max-width: 390px; margin: 0 0 4px; color: var(--color-text-secondary); font-size: 13px; line-height: 1.8; }
    .gallery { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px 28px; }
    .screen-card { min-width: 0; }
    .frame {
      overflow: hidden;
      border: 7px solid #1b1f1a;
      border-radius: 34px;
      background: var(--color-paper-100);
      box-shadow: 0 24px 55px rgba(22,28,20,.18);
    }
    .frame img { display: block; width: 100%; height: auto; }
    .caption { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; padding: 0 5px; color: var(--color-text-tertiary); font-size: 9px; }
    .caption strong { color: var(--color-text-secondary); font-weight: var(--weight-medium); }
    @media (max-width: 900px) { body { padding: 24px 16px; } .gallery { grid-template-columns: 1fr; } header { display: block; } header p { margin-top: 18px; } }
  </style>
</head>
<body>
  <header>
    <div><p class="eyebrow">Sayline / Learner experience</p><h1>一句一句，<br>听见自己。</h1></div>
    <p>从分类发现课程，进入沉浸式播放器完成听、读、写、说，再通过学习统计看见自己的节奏。收藏与上下切课沿用当前列表顺序。</p>
  </header>
  <main class="gallery">
    <article class="screen-card"><div class="frame"><img src="login-mobile.png" alt="登录页"></div><div class="caption"><strong>01 / 登录</strong><span>Account</span></div></article>
    <article class="screen-card"><div class="frame"><img src="home-mobile.png" alt="首页"></div><div class="caption"><strong>02 / 首页</strong><span>Discovery</span></div></article>
    <article class="screen-card"><div class="frame"><img src="favorites-mobile.png" alt="我喜欢"></div><div class="caption"><strong>03 / 我喜欢</strong><span>Saved courses</span></div></article>
    <article class="screen-card"><div class="frame"><img src="player-listen-mobile.png" alt="听模式"></div><div class="caption"><strong>04 / 播放器 · 听</strong><span>Listen</span></div></article>
    <article class="screen-card"><div class="frame"><img src="player-read-mobile.png" alt="读模式"></div><div class="caption"><strong>05 / 播放器 · 读</strong><span>Read</span></div></article>
    <article class="screen-card"><div class="frame"><img src="player-write-mobile.png" alt="写模式"></div><div class="caption"><strong>06 / 播放器 · 写</strong><span>Dictation</span></div></article>
    <article class="screen-card"><div class="frame"><img src="player-speak-mobile.png" alt="说模式"></div><div class="caption"><strong>07 / 播放器 · 说</strong><span>Shadowing</span></div></article>
    <article class="screen-card"><div class="frame"><img src="me-week-mobile.png" alt="周学习统计"></div><div class="caption"><strong>08 / 我的 · 周</strong><span>Weekly report</span></div></article>
    <article class="screen-card"><div class="frame"><img src="me-month-mobile.png" alt="月学习统计"></div><div class="caption"><strong>09 / 我的 · 月</strong><span>Monthly report</span></div></article>
  </main>
</body>
</html>
