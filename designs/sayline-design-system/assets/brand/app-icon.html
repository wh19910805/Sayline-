<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 512px; height: 512px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 76% 20%, rgba(217,181,110,.22), transparent 28%),
        #171a16;
    }
    .mark {
      position: relative;
      width: 270px;
      height: 140px;
    }
    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      top: 68px;
      height: 10px;
      border-radius: 10px;
      background: #f4f0e8;
    }
    .mark::before { left: 0; width: 92px; }
    .mark::after { right: 0; width: 92px; }
    .dot {
      position: absolute;
      width: 42px;
      height: 42px;
      left: 114px;
      top: 52px;
      border-radius: 50%;
      background: #c85d36;
    }
  </style>
</head>
<body>
  <div class="mark"><span class="dot"></span></div>
</body>
</html>
