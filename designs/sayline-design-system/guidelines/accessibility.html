<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--color-paper-50);font-family:var(--font-ui);color:var(--color-text)}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.focus{padding:13px 18px;border-radius:999px;background:var(--color-ink-900);color:white;outline:2px solid var(--color-action);outline-offset:4px}.target{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--color-border)}.note{font-size:11px;line-height:1.7;color:var(--color-text-secondary);max-width:330px}
</style></head><body><div class="row"><span class="focus">继续学习</span><span class="target"><img width="19" src="../assets/icons/play.svg" alt=""></span><span class="note">触控目标不小于 44×44 px；正文对比度至少 4.5:1；播放器文字使用固定遮罩层保证可读性。</span></div></body></html>
