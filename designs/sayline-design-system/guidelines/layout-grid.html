<!-- @dsCard group="Spacing" viewport="700x310" name="Mobile layout" subtitle="20px page inset, 44px targets, and a quiet bottom nav" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:20px;background:var(--color-paper-100);font-family:var(--font-ui)}.phone{width:350px;height:270px;margin:0 auto;border:8px solid var(--color-ink-900);border-radius:28px;background:var(--color-paper-50);overflow:hidden;padding:18px}.head{height:28px;border-radius:7px;background:var(--color-ink-900);width:58%;margin-bottom:14px}.tabs{height:34px;border-bottom:1px solid var(--color-border);margin-bottom:16px}.card{height:74px;border:1px solid var(--color-border);border-radius:14px;display:flex;align-items:center;gap:12px;padding:10px}.cover{width:52px;height:52px;border-radius:9px;background:linear-gradient(145deg,#68745a,#273023)}.bars{flex:1}.bars i{display:block;height:7px;width:70%;background:var(--color-paper-300);border-radius:8px}.bars i:last-child{width:43%;height:5px;margin-top:9px}.nav{height:46px;border-top:1px solid var(--color-border);margin-top:18px;display:flex;justify-content:space-around;padding-top:10px}.nav b{width:24px;height:24px;border-radius:50%;background:var(--color-paper-300)}
</style></head><body><div class="phone"><div class="head"></div><div class="tabs"></div><div class="card"><div class="cover"></div><div class="bars"><i></i><i></i></div></div><div class="nav"><b></b><b></b></div></div></body></html>
