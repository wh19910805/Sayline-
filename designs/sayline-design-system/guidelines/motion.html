<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:24px;background:var(--color-paper-100);font-family:var(--font-ui);color:var(--color-text-secondary)}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{padding:16px;border-radius:12px;background:var(--color-bg-elevated);border:1px solid var(--color-border)}b{display:block;color:var(--color-text);font-size:22px;margin-bottom:6px}.dot{width:28px;height:28px;border-radius:50%;background:var(--color-action);margin-bottom:12px}
</style></head><body><div class="row"><div class="tile"><div class="dot"></div><b>140 ms</b>Press, focus, icon color</div><div class="tile"><div class="dot" style="background:var(--color-moss-500)"></div><b>220 ms</b>Expand, tabs, confirmation</div><div class="tile"><div class="dot" style="background:var(--color-oat-500)"></div><b>320 ms</b>Course swipe, progress settle</div></div></body></html>
