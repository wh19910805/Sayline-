<!-- @dsCard group="Colors" viewport="700x180" name="Semantic states" subtitle="Muted statuses that remain readable on warm paper" -->
<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:22px;background:var(--color-paper-50);font-family:var(--font-ui)}.row{display:flex;gap:10px;flex-wrap:wrap}.pill{padding:11px 14px;border-radius:10px;font-size:11px;font-weight:650}.ok{background:var(--color-success-soft);color:var(--color-success)}.warn{background:var(--color-warning-soft);color:var(--color-warning)}.err{background:var(--color-danger-soft);color:var(--color-danger)}.info{background:var(--color-info-soft);color:var(--color-info)}
</style></head><body><div class="row"><span class="pill ok">已保存</span><span class="pill warn">字幕校验中</span><span class="pill err">播放失败</span><span class="pill info">网络已恢复</span></div></body></html>
