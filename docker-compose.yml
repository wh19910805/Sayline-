services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sayline}
      MYSQL_USER: ${MYSQL_USER:-sayline}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sayline_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sayline}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sayline_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-sayline} ${MINIO_ROOT_PASSWORD:-sayline_dev_password};
      mc mb --ignore-existing local/${STORAGE_BUCKET:-sayline-media};
      mc anonymous set none local/${STORAGE_BUCKET:-sayline-media};
      "

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-sayline}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: ${MYSQL_USER:-sayline}
      DB_PASSWORD: ${MYSQL_PASSWORD:-sayline_dev_password}
      JWT_SECRET: ${JWT_SECRET:-dev-only-sayline-secret-change-before-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8088}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-sayline}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-sayline_dev_password}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-sayline-media}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-false}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"

volumes:
  mysql-data:
  minio-data:
