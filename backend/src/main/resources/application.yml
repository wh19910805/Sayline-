spring:
  application:
    name: sayline-english-study
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sayline?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:sayline}
    password: ${DB_PASSWORD:sayline_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:dev-only-sayline-secret-change-before-production}
  access-token-minutes: 15
  refresh-token-days: 30
  cookie-secure: ${COOKIE_SECURE:false}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:${STORAGE_ENDPOINT:http://localhost:9000}}
    access-key: ${STORAGE_ACCESS_KEY:sayline}
    secret-key: ${STORAGE_SECRET_KEY:sayline_dev_password}
    bucket: ${STORAGE_BUCKET:sayline-media}
    region: ${STORAGE_REGION:us-east-1}
  admin:
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}
  seed-demo: ${APP_SEED_DEMO:false}

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","message":"%replace(%msg){''"'',''\\"''}"}%n'
